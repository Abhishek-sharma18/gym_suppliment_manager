services:
  - type: web
    name: gym-khata-api
    runtime: node
    plan: free
    # NOTE: with NODE_ENV=production, npm OMITS devDependencies by default.
    # tsx (the runtime that executes the TS server) therefore lives in backend's
    # regular dependencies, not devDependencies. Do not move it back.
    buildCommand: npm install
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
