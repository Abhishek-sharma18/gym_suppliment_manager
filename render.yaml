services:
  - type: web
    name: gym-khata-api
    runtime: node
    plan: free
    # npm >= 7 (Node 20) installs devDependencies even with NODE_ENV=production - required: tsx runs the server.
    buildCommand: npm install
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
